<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fluency2Work</title>
    <style>
        /* ====== CSS: Estilos da Aplicação ====== */
        
        /* Base / Theme Duolingo-style */
        :root{
            /* Cores Duolingo */
            --duo-green-dark: #58cc02; /* Para Balão B e Elementos Primários */
            --duo-green-light: #80e900;
            --duo-blue-dark: #1cb0f6; /* Para Balão A e Elementos Secundários */
            --duo-blue-light: #58d8ff;
            --primary: var(--duo-blue-dark);
            
            --gray-bg: #f3f4f6;
            --gray-border: #d1d5db;
            --font-base: clamp(16px, 2.5vw, 18px);
            --radius: 1rem;
            --shadow: 0 4px 12px rgba(0,0,0,.1);
            
            /* Safe Areas (Para Mobile) */
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; }

        html, body{
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
            font-size: var(--font-base);
            background: var(--gray-bg);
            min-height: 100vh;
        }

        body{
            display:flex;
            align-items:flex-start;
            justify-content:center;
            padding-top: calc(50px + var(--safe-top));
            padding-bottom: var(--safe-bottom);
        }

        .card{
            background:#fff; width:100%; max-width: 800px;
            padding: clamp(16px, 3.5vw, 32px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display:flex; flex-direction:column;
        }

        h2{ font-size: clamp(1.125rem, 3.5vw, 1.5rem); margin: 0 0 1rem 0; }
        h3{ font-size: clamp(1rem, 3.5vw, 1.25rem); margin: 0 0 1rem 0; }


        /* Nav Header (Topo) */
        .nav-header{
            background: var(--duo-blue-dark); color: #fff;
            position: fixed; top: 0; left: 0; right: 0;
            padding: 10px clamp(12px, 3.5vw, 32px);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 4px rgba(0,0,0,.15);
            z-index: 100;
            height: calc(50px + var(--safe-top));
            padding-top: var(--safe-top);
        }
        .nav-header h1{ font-size: 1.25rem; margin: 0; font-weight: 700; }
        .nav-header-icons{ display: flex; align-items: center; gap: 1rem; }

        /* Buttons & Inputs */
        .btn{
            width:100%;
            padding: clamp(12px, 3.2vw, 14px) clamp(16px, 3.5vw, 20px);
            margin-top:.75rem; border:0; border-radius: .75rem;
            font-weight:600; cursor:pointer; text-align:center; font-size: 1rem;
            transition: filter .15s ease, transform .02s ease;
            touch-action: manipulation;
        }
        .btn:active{ transform: scale(.99); }
        .btn.primary{ background: var(--primary); color:#fff; }
        .btn.secondary{ background:#e5e7eb; color:#111827; }
        .btn.ghost{ background:transparent; color:var(--primary); }
        .btn.danger{ background:#ef4444; color:#fff; }


        .flex{ display:flex; }
        .gap-md{ gap: 1rem; }

        .hint-btn{
            background: transparent; border: none; cursor: pointer;
            font-size: 1.5rem; padding: 0 .5rem; line-height: 1; height: 44px;
        }
        
        .audio-btn{ 
            background: transparent; border: 2px solid; border-radius: 50%;
            cursor: pointer; font-size: 1rem; padding: 5px;
            width: 35px; height: 35px; display: flex; justify-content: center; align-items: center;
            transition: background 0.1s;
        }
        .card-front .audio-btn { border-color: #1f2937; color: #1f2937;} 
        .card-back .audio-btn { border-color: #fff; color: #fff;} 
        .audio-btn:hover { background: rgba(0,0,0,0.1); }


        .input-group{
            position: relative; display:flex; align-items:center; width:100%;
            gap:.5rem; margin-bottom: .75rem; flex-wrap: wrap; 
        }

        .hint-bubble{
            position: absolute; right: 0; bottom: calc(100% + 8px);
            background:#111827; color:#fff; padding:.5rem .75rem; border-radius:.5rem;
            font-size:.95rem; white-space:pre-wrap; display:none; max-width: min(92vw, 420px); z-index:10;
        }
        .hint-bubble::after{
            content:''; position:absolute; bottom:-8px; right:12px; border-width:8px 8px 0 8px;
            border-style:solid; border-color:#111827 transparent transparent transparent;
        }

        .toolbar{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: .75rem; margin-top:.25rem;
        }
        .toolbar .btn{ margin-top:0; }

        /* Estilos de Mapa/Navegação Duolingo */
        #map-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 10px;
            padding-bottom: 80px;
        }

        .day-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
            position: relative;
        }

        .day-node {
            position: relative;
            z-index: 2;
            padding-bottom: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .day-node p {
            margin: .5rem 0 0; 
            text-align: center; 
        }
        
        .day-path > div:not(.day-node){
            height: 40px; 
            width: 4px; 
            background: var(--gray-border); 
            margin: 0 auto;
        }


        /* Bolha Principal (Dia no Mapa) */
        .main-bubble {
            width: 80px; height: 80px;
            background: var(--duo-green-dark);
            border: 4px solid var(--duo-green-light);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; color: #fff; font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,.2);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .main-bubble:hover { transform: scale(1.05); }
        /* CORREÇÃO APLICADA AQUI: */
        .main-bubble.completed {
            background: var(--gray-border) !important;
            border-color: #9ca3af !important;
            color: #4b5563 !important;
        }

        /* Bolhas de Cenário e Sub-Lição */
        .scenario-bubble, .sub-bubble {
            width: 60px; height: 60px;
            border: 4px solid var(--duo-blue-light);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff;
            box-shadow: 0 2px 4px rgba(0,0,0,.15);
            cursor: pointer;
            transition: transform 0.1s ease;
            font-size: 1.4rem;
            font-weight: 500;
        }
        .scenario-bubble {
            width: 70px; height: 70px;
            font-size: 1.6rem;
            background: var(--duo-blue-dark);
            border-color: var(--duo-blue-light);
        }
        
        .sub-bubble.role-A { background: var(--duo-blue-dark); border-color: var(--duo-blue-light); }
        .sub-bubble.role-B { background: var(--duo-green-dark); border-color: var(--duo-green-light); }
        .sub-bubble.completed, .scenario-bubble.completed {
            background: var(--gray-border);
            border-color: #9ca3af;
            color: #4b5563;
        }
        .sub-bubble.active, .scenario-bubble.active {
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(43, 114, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(43, 114, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(43, 114, 255, 0); }
        }

        /* Estilo para a Tela de Flash Card */
        .flashcard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .flashcard {
            width: 100%; max-width: 400px; height: 250px;
            background: #fff; border: 2px solid var(--duo-blue-dark);
            border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: 600; color: #1f2937;
            box-shadow: 0 8px 16px rgba(0,0,0,.15);
            cursor: pointer;
            perspective: 1000px; 
            margin-bottom: 20px;
        }
        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px;
            border-radius: 13px;
        }
        .card-front { background: var(--duo-green-light); color: #1f2937; } 
        .card-back { background: var(--duo-blue-light); color: #fff; transform: rotateY(180deg); } 
        
        .flashcard-progress { margin-bottom: 15px; font-size: 1rem; color: #4b5563; }
        .flashcard-nav { display: flex; gap: 10px; margin-top: 20px; }


        /* Chat Simulator */
        .chat-scroll{
            flex:1; max-height: min(60vh, 520px); 
            overflow-y:auto; margin-bottom: 1rem; padding-right: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .chat-bubble{
            max-width: 85%; padding: 1rem; border-radius: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,.08);
            font-size: 1rem; line-height: 1.45; margin: .25rem 0;
            word-wrap: break-word; overflow-wrap: anywhere; color: #fff;
        }
        .bubble-a{ background: var(--duo-blue-dark); }
        .bubble-b{ background: var(--duo-green-dark); }
        .hidden-text{ filter: blur(8px); cursor: pointer; transition: filter 160ms ease; user-select: none; }
        .hidden-text.revealed{ filter: none; user-select: text; }
        audio{ width:100%; margin-top:.5rem; }

        /* Estilo de Erro de Input */
        .input-group input {
            padding: 10px; 
            border: 2px solid var(--gray-border); 
            border-radius: 8px; 
            flex-grow: 1;
            transition: border-color 0.2s;
        }
        .input-group input.error-input {
            border-color: #ef4444; 
        }
        
        /* Menu de Configurações */
        .settings-menu{
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 200;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: calc(70px + var(--safe-top));
            visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s;
        }
        .settings-menu.visible{
            visibility: visible; opacity: 1;
        }
        .settings-menu-content{
            background: white; border-radius: var(--radius); padding: 20px;
            width: 90%; max-width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .settings-menu-content h3{ margin-top: 0; color: #111827;}


        @media (min-width: 640px){
            .chat-bubble{ max-width: 70%; }
            .toolbar{ grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>

<body>
    <header class="nav-header">
        <h1 id="header-title">Fluency2Work</h1>
        <div class="nav-header-icons">
            <div style="font-size:1.1rem;">❤️ 5</div>
            <div style="font-size:1.1rem;">🔥 10</div>
            <button class="hint-btn" style="color:white; font-size:1.8rem;" onclick="toggleSettingsMenu()">☰</button>
        </div>
    </header>
    
    <div id="settings-menu" class="settings-menu" onclick="event.target.id === 'settings-menu' && toggleSettingsMenu()">
        <div class="settings-menu-content">
            <h3>Configurações</h3>
            <p style="font-size:0.9rem; color:#6b7280; margin-bottom:1.5rem;">
                Atenção: Resetar o progresso apagará todos os dados salvos localmente no seu navegador.
            </p>
            <button class="btn danger" onclick="resetProgress()">
                ❌ Resetar Progresso (Limpar LocalStorage)
            </button>
            <button class="btn secondary" style="margin-top:1rem;" onclick="toggleSettingsMenu()">
                Voltar
            </button>
        </div>
    </div>

    <div id="app" style="width:100%;max-width:800px; padding: 0 clamp(12px, 3.5vw, 32px);">
        <div class="card">
            <h2>Carregando...</h2>
            <p>Aguarde o carregamento dos dados do curso.</p>
        </div>
    </div>

    <script src="lessons-data.js"></script>
    <script src="course-data.js"></script>
    <script>
        // 1) DADOS — Estrutura de tipos de lição (Hardcoded)
        const lessonTypes = [
            { id: 'words', title: 'Vocabulário', icon: '📖' },
            { id: 'phrases', title: 'Frases', icon: '💬' },
            { id: 'conversation', title: 'Simulação', icon: '🗣️' }
        ];

        // Variáveis que serão preenchidas pelas variáveis globais estáticas (window.lessonDataStatic e window.courseStructureStatic)
        let courseStructure = [];
        window.initialCourseStructure = []; // Usado para reset
        let lessonData = {}; // Guarda dailyLessons e planningLessons

        // 2) ESTADO E UTILIDADES
        const LOCAL_STORAGE_KEY = 'fluency2Work_course_progress';

        let stage='map', currentDayIndex=0, currentScenarioIndex=0, currentRole=null, currentLessonIndex=0;
        let flashcardQueue = []; 
        let currentCardIndexInQueue = 0; 
        let isFlashcardFlipped = false;
        let lastInputFailed = false; 
        let lastInputText = ''; 
        
        let role=null, step=0, history=[];

        const app = document.getElementById('app');
        const player = new Audio();
        
        // NOVO: Função para carregar dados das variáveis globais estáticas 
        function loadDataFromStaticJS() {
            if (!window.lessonDataStatic || !window.courseStructureStatic) {
                throw new Error("Dados estáticos não encontrados.");
            }
            
            // Atribui e faz cópias profundas para garantir que o estado inicial seja limpo
            lessonData = JSON.parse(JSON.stringify(window.lessonDataStatic));
            return JSON.parse(JSON.stringify(window.courseStructureStatic));
        }

        window.toggleSettingsMenu = () => {
            const menu = document.getElementById('settings-menu');
            menu.classList.toggle('visible');
        };

        window.resetProgress = () => {
            if (confirm("Tem certeza que deseja resetar todo o seu progresso? Esta ação é irreversível.")) {
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                courseStructure = JSON.parse(JSON.stringify(window.initialCourseStructure)); 
                setStage('map', 0, 0, null);
                toggleSettingsMenu();
                alert("Progresso resetado com sucesso!");
                console.log("LocalStorage limpo e aplicação resetada.");
            }
        };

        const updateCourseStructureFromSavedData = (savedData) => {
            savedData.forEach((savedDay, dIdx) => {
                if (courseStructure[dIdx] && courseStructure[dIdx].id === savedDay.id) {
                    savedDay.scenarios.forEach((savedScenario, sIdx) => {
                        if (courseStructure[dIdx].scenarios[sIdx] && courseStructure[dIdx].scenarios[sIdx].id === savedScenario.id) {
                            
                            // Restaura o status 'completed' do CENÁRIO no objeto em memória
                            courseStructure[dIdx].scenarios[sIdx].completed = savedScenario.completed;
                            
                            ['A', 'B', 'C'].forEach(roleKey => {
                                const lessons = courseStructure[dIdx].scenarios[sIdx].lessons[roleKey];
                                const savedLessons = savedScenario.lessons[roleKey];

                                if (lessons && savedLessons) {
                                    // Restaura o status 'completed' de CADA SUB-LIÇÃO no objeto em memória
                                    lessons.forEach((lesson, lIdx) => {
                                        if (savedLessons[lIdx] && lesson.id === savedLessons[lIdx].id) {
                                            lesson.completed = savedLessons[lIdx].completed;
                                        }
                                    });
                                }
                            });
                        }
                    });
                }
            });
        };
        
        const loadProgress = () => {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved && courseStructure.length > 0) {
                try {
                    const savedData = JSON.parse(saved);
                    updateCourseStructureFromSavedData(savedData);
                    console.log("Progresso carregado com sucesso.");
                } catch (e) {
                    console.error("Erro ao carregar ou parsear o progresso do localStorage:", e);
                    localStorage.removeItem(LOCAL_STORAGE_KEY);
                }
            }
        };

        const saveProgress = () => {
            // Salva apenas a estrutura de curso com o status de conclusão
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(courseStructure));
        };
        
        const cleanStringForComparison = (str) => {
            if (!str) return '';
            let cleaned = str.toLowerCase();
            cleaned = cleaned.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()'"’“”]/g, "");
            cleaned = cleaned.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
            return cleaned;
        };


        const scrollToBottom = () => {
            const b = document.getElementById('chat-scroll');
            if (b) b.scrollTop = b.scrollHeight;
        };
        const playAudio = (src, playbackRate = 1.0) => { 
            if(!src) return; 
            try{ 
                player.pause(); 
                player.currentTime=0; 
                // Definir playbackRate ANTES de definir src
                player.playbackRate = playbackRate;
                player.src=src; 
                // Garantir que playbackRate seja mantido quando o áudio estiver pronto
                const applyPlaybackRate = () => {
                    if (player.playbackRate !== playbackRate) {
                        player.playbackRate = playbackRate;
                    }
                };
                player.onloadedmetadata = applyPlaybackRate;
                player.oncanplay = applyPlaybackRate;
                player.play().then(() => {
                    // Garantir após iniciar a reprodução
                    applyPlaybackRate();
                }).catch(err => console.error('Erro ao tocar áudio:', err)); 
            }catch(err){
                console.error('Erro ao configurar áudio:', err);
            } 
        };
        const pushMessage = msg => { history.push(msg); if(msg.audio) playAudio(msg.audio); };
        const revealAll = () => document.querySelectorAll('.hidden-text').forEach(el=>el.classList.add('revealed'));
        const hideAll = () => document.querySelectorAll('.hidden-text').forEach(el=>el.classList.remove('revealed'));
        
        const getScenario = () => courseStructure[currentDayIndex]?.scenarios[currentScenarioIndex];

        const getLesson = () => {
            const scenario = getScenario();
            if (!scenario) return null;
            const lessons = scenario.lessons;
            
            if (currentRole === 'A') return lessons.A[currentLessonIndex];
            if (currentRole === 'B') return lessons.B[currentLessonIndex];
            return lessons.C?.[0]; 
        };
        
        const getConversation = () => getScenario()?.conversations;
        
        window.playCardAudio = (text, dIdx, sIdx, playbackRate = 1.0) => {
            const scenario = courseStructure[dIdx]?.scenarios[sIdx];
            if (!scenario) return;

            const sampleAudioPath = scenario.conversations?.A?.[0]?.audio;
            if (!sampleAudioPath) {
                console.error("Não foi possível encontrar um caminho de áudio de exemplo para o cenário. Áudio do flashcard indisponível.");
                return;
            }
            const baseAudioPath = sampleAudioPath.substring(0, sampleAudioPath.lastIndexOf('/')); 
            
            const filename = text
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()'"’“”]/g, '') 
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .trim()
                .replace(/\s+/g, '-'); 
            
            const audioPath = `${baseAudioPath}/flashcard/${filename}.mp3`;
            
            console.log(`Tentando tocar audio em: ${audioPath} (velocidade: ${playbackRate}x)`);
            
            // Parar qualquer reprodução anterior
            if (window.flashcardPlayer) {
                window.flashcardPlayer.pause();
                window.flashcardPlayer = null;
            }
            if (window.flashcardSource) {
                try {
                    window.flashcardSource.stop();
                } catch(e) {}
                window.flashcardSource = null;
            }
            
            // Tentar Web Audio API primeiro
            try {
                if (!window.flashcardAudioContext) {
                    window.flashcardAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // Se o contexto estiver suspenso, retomar
                if (window.flashcardAudioContext.state === 'suspended') {
                    window.flashcardAudioContext.resume().then(() => {
                        console.log('AudioContext retomado');
                    });
                }
                
                // Aguardar contexto estar pronto
                const ensureContextReady = () => {
                    return new Promise((resolve) => {
                        if (window.flashcardAudioContext.state === 'running') {
                            resolve();
                        } else {
                            window.flashcardAudioContext.resume().then(() => resolve());
                        }
                    });
                };
                
                // Carregar e tocar usando Web Audio API
                ensureContextReady().then(() => {
                    return fetch(audioPath);
                }).then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.arrayBuffer();
                })
                    .then(arrayBuffer => {
                        return window.flashcardAudioContext.decodeAudioData(arrayBuffer);
                    })
                    .then(audioBuffer => {
                        // Criar buffer source
                        window.flashcardSource = window.flashcardAudioContext.createBufferSource();
                        window.flashcardSource.buffer = audioBuffer;
                        
                        // Criar gain node
                        const gainNode = window.flashcardAudioContext.createGain();
                        gainNode.gain.value = 1.0;
                        
                        // Conectar: source -> gain -> destination
                        window.flashcardSource.connect(gainNode);
                        gainNode.connect(window.flashcardAudioContext.destination);
                        
                        // Aplicar velocidade de reprodução ANTES de iniciar
                        // IMPORTANTE: playbackRate deve ser definido ANTES de conectar ou iniciar
                        window.flashcardSource.playbackRate.value = playbackRate;
                        
                        console.log(`[Web Audio] PlaybackRate ANTES de conectar: ${window.flashcardSource.playbackRate.value}x`);
                        
                        // Verificar se foi aplicado
                        if (Math.abs(window.flashcardSource.playbackRate.value - playbackRate) > 0.01) {
                            console.error(`ERRO: PlaybackRate não foi aplicado! Esperado: ${playbackRate}x, Atual: ${window.flashcardSource.playbackRate.value}x`);
                            // Tentar forçar novamente
                            window.flashcardSource.playbackRate.value = playbackRate;
                        }
                        
                        // Tocar
                        window.flashcardSource.start(0);
                        
                        // Verificar novamente após iniciar
                        setTimeout(() => {
                            const currentRate = window.flashcardSource.playbackRate.value;
                            console.log(`[Web Audio] PlaybackRate APÓS iniciar: ${currentRate}x`);
                            if (Math.abs(currentRate - playbackRate) > 0.01) {
                                console.error(`ERRO: PlaybackRate mudou após iniciar! Esperado: ${playbackRate}x, Atual: ${currentRate}x`);
                                // Tentar corrigir
                                window.flashcardSource.playbackRate.value = playbackRate;
                            }
                        }, 50);
                        
                        // Limpar quando terminar
                        window.flashcardSource.onended = () => {
                            window.flashcardSource = null;
                        };
                    })
                    .catch(err => {
                        console.warn('Web Audio API falhou, usando fallback HTML5:', err);
                        // Fallback para HTML5 Audio com tentativas múltiplas
                        playWithHTML5Audio(audioPath, playbackRate);
                    });
            } catch (err) {
                console.warn('Erro ao inicializar Web Audio API, usando fallback:', err);
                playWithHTML5Audio(audioPath, playbackRate);
            }
            
            // Função auxiliar para HTML5 Audio fallback
            function playWithHTML5Audio(path, rate) {
                window.flashcardPlayer = new Audio();
                window.flashcardPlayer.src = path;
                
                // Tentar definir playbackRate em múltiplos momentos
                window.flashcardPlayer.playbackRate = rate;
                
                window.flashcardPlayer.onloadedmetadata = () => {
                    window.flashcardPlayer.playbackRate = rate;
                    console.log(`[HTML5] PlaybackRate após loadedmetadata: ${window.flashcardPlayer.playbackRate}x`);
                };
                
                window.flashcardPlayer.oncanplay = () => {
                    window.flashcardPlayer.playbackRate = rate;
                    console.log(`[HTML5] PlaybackRate após canplay: ${window.flashcardPlayer.playbackRate}x`);
                };
                
                window.flashcardPlayer.onplay = () => {
                    window.flashcardPlayer.playbackRate = rate;
                    console.log(`[HTML5] PlaybackRate após play: ${window.flashcardPlayer.playbackRate}x`);
                };
                
                window.flashcardPlayer.play().then(() => {
                    window.flashcardPlayer.playbackRate = rate;
                    console.log(`[HTML5] PlaybackRate após promise: ${window.flashcardPlayer.playbackRate}x`);
                }).catch(e => {
                    console.error('Erro ao tocar áudio HTML5:', e);

        // 3) RENDERIZAÇÃO PRINCIPAL

        // 6) TELA DE LIÇÕES DETALHADAS POR PAPEL

        // 8) TELA FLASH CARD
        function renderFlashcard(){
            const lesson = getLesson();
            
            if (!lesson || !lesson.words || lesson.words.length === 0) {
                console.error("Lição de Flashcard sem conteúdo 'words'. Marcando como completa e voltando.");
                lesson.completed = true;
                saveProgress();
                setStage('flashcard-selector'); 
                return;
            }

            if (flashcardQueue.length === 0) {
                lesson.completed = true;
                saveProgress(); 
                setStage('flashcard-selector'); 
                return;
            }

            const realCardIndex = flashcardQueue[currentCardIndexInQueue]; 
            const card = lesson.words[realCardIndex];
            const remaining = flashcardQueue.length;
            const max = lesson.words.length;

                                <div class="card-front">
                                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">

                                            ${card.word}
                                        </div>
                                        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                                            <button class="audio-btn" title="Ouvir Pronúncia (Velocidade Normal)" onclick="event.stopPropagation(); playCardAudio('${card.word}', ${currentDayIndex}, ${currentScenarioIndex}, 1.0)">🔊</button>
                                            <button class="audio-btn" title="Ouvir Pronúncia (Velocidade Lenta 0.5x)" onclick="event.stopPropagation(); playCardAudio('${card.word}', ${currentDayIndex}, ${currentScenarioIndex}, 0.5)">🐌</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-back">
                                    <div style="font-weight: 500; font-size:1.5rem; color: #fff;">
                                        ${card.translation}
                                    </div>
                                </div>

                        </div>
                        
                        ${isFlashcardFlipped ? `
                            <div class="flashcard-nav" style="flex-direction: column; width: 100%; max-width: 400px; gap: 15px;">
                                <button class="btn primary" style="background:var(--duo-green-dark);" onclick="markAsKnown()">✅ SEI (Remover da fila)</button>
                                <button class="btn secondary" style="color:var(--duo-blue-dark);" onclick="markAsUnknown()">🔄 NÃO SEI (Repetir depois)</button>
                            </div>
                        ` : `
                            <div class="flashcard-nav" style="width: 100%; max-width: 400px;">
                                <button class="btn primary" onclick="flipCard()">REVELAR RESPOSTA</button>

                    </div>

                </div>
            `;
        }
        
        // 9) TELA ESCOLHA DE PAPEL (Para a Conversa)
        function renderRoles(){
             app.innerHTML = `
                <div class="card" style="margin-top:20px;">
                    <h2 style="text-align:center;margin-bottom:1rem">${getScenario().name} - Escolha seu Papel</h2>
                    <div class="flex gap-md" style="flex-wrap:wrap">
                        <button class="btn primary" style="flex:1 1 200px; background:var(--duo-blue-dark);" onclick="chooseRole('A')">Pessoa A (Ex: Scrum Master)</button>
                        <button class="btn primary" style="flex:1 1 200px; background:var(--duo-green-dark);" onclick="chooseRole('B')">Pessoa B (Ex: Desenvolvedor)</button>
                    </div>
                    <button class="btn ghost" onclick="setStage('role-choice-lessons')">Voltar</button>
                </div>`;
        }

        // 10) TELA DE CHAT
        function renderChat(){
            const conv = getConversation();
            const finished = (role==='A' && step>=conv.A.length) || (role==='B' && step>=conv.B.length);
            const hist = history.map(msg=>{
                const a = msg.speaker===role ? 'flex-end' : 'flex-start';
                const b = msg.speaker==='A' ? 'bubble-a' : 'bubble-b';
                const au = msg.audio ? `<audio controls><source src="${msg.audio}" type="audio/mpeg"></audio>` : '';
                const txt = `<span class="hidden-text" title="Clique para revelar" onclick="this.classList.toggle('revealed')">${msg.text}</span>`;
                return `<div style="display:flex;justify-content:${a}"><div class="chat-bubble ${b}"><p style="margin:0">${txt}</p>${au}</div></div>`;
            }).join('');

            const inp = finished ? `<div style="text-align:center;color:#6b7280">Fim da conversa 🎉</div>` : `
                <div class="input-group" style="flex-wrap: nowrap; margin-top:.5rem">
                    <input id="chat-input" type="text" placeholder="Digite a resposta correta..." 
                           value="${lastInputText}" 
                           class="${lastInputFailed ? 'error-input' : ''}" />
                    <button id="hint-btn" class="hint-btn" title="Mostrar sugestão da próxima fala" aria-label="Mostrar dica">👁</button>
                    <button id="audio-btn" class="audio-btn" title="Ouvir a próxima fala" aria-label="Ouvir próxima fala">🔊</button>
                    <button class="btn primary" style="width:auto; flex: 0 0 auto" onclick="send()">Enviar</button>
                    <div id="hint-bubble" class="hint-bubble"></div>
                </div>`;

            app.innerHTML = `
                <div class="card" style="margin-top:20px;">
                    <h2>${getScenario().name} - Simulação de Conversa</h2>
                    <div id="chat-scroll" class="chat-scroll">${hist}</div>
                    ${inp}
                    ${lastInputFailed ? '<p style="color: #ef4444; margin: -10px 0 10px 0; text-align:center; font-weight:600;">❌ Resposta incorreta. Corrija e envie novamente!</p>' : ''}
                    <div class="toolbar">
                        <button class="btn secondary" onclick="setStage('role-choice-lessons')">📚 Voltar ao Cenário</button>
                        <button class="btn secondary" onclick="playFullScript()">🎧 Tocar roteiro</button>
                        <button class="btn secondary" onclick="revealAll()">👁️ Revelar tudo</button>
                        <button class="btn secondary" onclick="hideAll()">🙈 Ocultar tudo</button>
                    </div>
                </div>`;

            const ci = document.getElementById('chat-input'),
                hb = document.getElementById('hint-bubble'),
                hbtn = document.getElementById('hint-btn'),
                abtn = document.getElementById('audio-btn');

            if (ci && hbtn && abtn && hb){
                const hintText = role==='A' ? (conv.A[step]?.pergunta || '') : (conv.B[step]?.resposta || '');
                const hintAudio = role==='A' ? (conv.A[step]?.audio || '') : (conv.B[step]?.audio || '');
                hb.textContent = hintText;

                hbtn.onmouseenter = () => { if (matchMedia('(hover: hover)').matches && hintText) hb.style.display = 'block'; };
                hbtn.onmouseleave = () => { if (matchMedia('(hover: hover)').matches) hb.style.display = 'none'; };
                hbtn.onclick = () => { hb.style.display = hb.style.display==='block' ? 'none' : 'block'; };

                abtn.onclick = () => { if (hintAudio) playAudio(hintAudio); };

                ci.focus();
                ci.onkeydown = e => { 
                    if (e.key === 'Enter'){ 
                        e.preventDefault(); 
                        send(); 
                    }
                };
                
                ci.oninput = () => {
                     lastInputText = ci.value; 
                     if (lastInputFailed) {
                         lastInputFailed = false;
                         render(); 
                     }
                };
            }
            scrollToBottom();
        }

        // 11) Ações (Navegação e Lógica)
        
        window.setStage = (s, dIdx = currentDayIndex, sIdx = currentScenarioIndex, r = currentRole) => {
            stage=s;
            currentDayIndex = dIdx;
            currentScenarioIndex = sIdx;
            currentRole = r; 
            
            if (s !== 'chat'){ step=0; history=[]; lastInputFailed = false; lastInputText = ''; }
            if (s === 'day-scenarios') currentScenarioIndex = null;
            if (s === 'role-choice-lessons') currentRole = null; 
            
            render();
        };

        window.startFlashcardLesson = (dIdx, sIdx, roleKey, lIdx) => {
            currentDayIndex = dIdx;
            currentScenarioIndex = sIdx;
            currentRole = roleKey;
            currentLessonIndex = lIdx;
            
            const lesson = courseStructure[dIdx].scenarios[sIdx].lessons[roleKey][lIdx];
             if (!lesson || !lesson.words) {
                console.error("Tentativa de iniciar lição sem conteúdo 'words'.");
                return;
            }

            flashcardQueue = lesson.words.map((_, index) => index); 
            currentCardIndexInQueue = 0;
            isFlashcardFlipped = false;
            
            setStage('flashcard');
        };

        window.markAsKnown = () => {
            flashcardQueue.splice(currentCardIndexInQueue, 1);
            if (flashcardQueue.length > 0) {
                currentCardIndexInQueue = currentCardIndexInQueue % flashcardQueue.length;
            }
            isFlashcardFlipped = false;
            render();
        };

        window.markAsUnknown = () => {
            const cardId = flashcardQueue.splice(currentCardIndexInQueue, 1)[0];
            flashcardQueue.push(cardId);
            currentCardIndexInQueue = currentCardIndexInQueue % flashcardQueue.length;
            isFlashcardFlipped = false;
            render();
        };

        window.startLessonConversation = (dIdx, sIdx) => {
            currentDayIndex = dIdx;
            currentScenarioIndex = sIdx;
            currentRole = 'C';
            currentLessonIndex = 0;
            
            setStage('role'); 
        };

        window.flipCard = () => {
            isFlashcardFlipped = !isFlashcardFlipped;
            render();
        };

        window.chooseRole = r => {
            role=r; setStage('chat');
            const conv = getConversation();
            if (r==='B'){
                const first = conv.A?.[0];
                if(first) pushMessage({ speaker:'A', text:first.pergunta, audio:first.audio });
                step=0;
            } else {
                step=0;
            }
            render();
        };
        
        window.send = () => {
            const i = document.getElementById('chat-input');
            if (!i || !i.value.trim()) return;

            const t = i.value.trim();
            const co = getConversation();
            
            if (!co || (!co.A && !co.B)) {
                alert("Erro: Estrutura de conversação não definida ou vazia.");
                return;
            }
            
            const conversationScript = role==='A' ? co.A : co.B;
            const ul = conversationScript[step];

            if (!ul) {
                // Marca a lição de conversa como completa ao final
                const lesson = getLesson();
                if (lesson) lesson.completed = true; 
                saveProgress(); 
                render(); 
                return;
            }
            
            const expectedText = (role==='A' ? ul.pergunta : ul.resposta) || '';
            const cleanedInput = cleanStringForComparison(t);
            const cleanedExpected = cleanStringForComparison(expectedText);

            const isCorrect = cleanedInput === cleanedExpected;

            if (isCorrect) {
                lastInputFailed = false; 
                lastInputText = ''; 
                
                pushMessage({ speaker: role, text: t, audio: ul.audio || null });

                const nextSpeaker = role==='A' ? 'B' : 'A';
                const nextStepIndex = role==='A' ? step : step + 1;
                const nextConversationScript = role==='A' ? co.B : co.A;
                const rl = nextConversationScript[nextStepIndex];
                
                if (rl) pushMessage({ speaker: nextSpeaker, text: rl.pergunta || rl.resposta, audio: rl.audio });

                step++;
                
                const finished = (role==='A' && step>=co.A.length) || (role==='B' && step>=co.B.length);
                if (finished) {
                    getScenario().lessons.C[0].completed = true; 
                    saveProgress(); 
                } 
                render(); 
            } else {
                lastInputFailed = true;
                lastInputText = t; 
                render(); 
            }
        };

        const playFullScript = async () => {
            const conv = getConversation();
             if (!conv || !conv.A || !conv.B) {
                alert("Erro: Estrutura de conversação inválida.");
                return;
            }

            const maxLen = Math.max(conv.A.length, conv.B.length);
            for (let i=0;i<maxLen;i++){
                if (conv.A[i]?.audio) await playSequential(conv.A[i].audio);
                if (conv.B[i]?.audio) await playSequential(conv.B[i].audio);
            }
        };
        const playSequential = src => new Promise(res=>{
            player.onended = () => res();
            player.onerror = () => res();
            try{ player.src = src; player.play().catch(()=>res()); }catch{ res(); }
        });


        // 12) INICIALIZAÇÃO
        
        function initializeApp() {
            try {
                // 1. CARREGA OS DADOS DAS VARIÁVEIS GLOBAIS
                let fetchedCourseStructure = loadDataFromStaticJS();
                
                // 2. Mesclar as lições nos cenários (Cria a chave 'lessons')
                fetchedCourseStructure.forEach(day => {
                    day.scenarios.forEach(scenario => {
                        if (scenario.lessonKey && lessonData[scenario.lessonKey]) {
                            // Cria uma cópia profunda para que cada lição possa ter seu próprio status 'completed'
                            // Nota: O uso de JSON.parse(JSON.stringify(obj)) aqui é uma forma simples de deep clone.
                            scenario.lessons = JSON.parse(JSON.stringify(lessonData[scenario.lessonKey]));
                        }
                    });
                });

                // 3. Salvar a estrutura inicial (sem status de completed) para o reset
                window.initialCourseStructure = JSON.parse(JSON.stringify(fetchedCourseStructure));

                // 4. Carregar o progresso salvo e mesclar (Aplica os status 'completed' do LocalStorage)
                courseStructure = fetchedCourseStructure;
                loadProgress(); 
                
                // 5. Iniciar a renderização
                render();

            } catch (error) {
                console.error("Erro ao carregar os dados JS. Verifique o console.", error);
                app.innerHTML = '<div class="card" style="color:red;"><h2>Erro de Inicialização</h2><p>Não foi possível carregar os dados do curso. Verifique se os arquivos <b>lessons-data.js</b> e <b>course-data.js</b> estão na mesma pasta que o <b>index.html</b> e se a sintaxe JavaScript está correta.</p></div>';
            }
